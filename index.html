<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balde de agua</title>
    <link rel="stylesheet" href="index.css">

</head>

<body>
    <header>
        <h1>Adivinhe a Palavra</h1>
    </header>
    <main>
        <div class="display">
            <section class="area-imagem">
                <img id="imagem" src="FORCA_COMECO.png" alt="">
            </section>
            <section class="area-palavra">
                <p id="palavra"></p>
                <p id="mensagem"></p>
                <p id="erros">Erros: 0 de 6</p>
            </section>
            <section class="teclado">
                <div class="coisa">
                <button class="letra">A</button>
                <button class="letra">B</button>
                <button class="letra">C</button>
                <button class="letra">D</button>
                <button class="letra">E</button>
                <button class="letra">F</button>
                <button class="letra">G</button>
                <button class="letra">H</button>
                <button class="letra">I</button>
                <button class="letra">J</button>
                <button class="letra">K</button>
                <button class="letra">L</button>
                <button class="letra">M</button>
                <button class="letra">N</button>
                </div>
                <br>
                <div class="coisa2">    
                <button class="letra2">O</button>
                <button class="letra2">P</button>
                <button class="letra2">Q</button>
                <button class="letra2">R</button>
                <button class="letra2">S</button>
                <button class="letra2">T</button>
                <button class="letra2">U</button>
                <button class="letra2">V</button>
                <button class="letra2">W</button>
                <button class="letra2">X</button>
                <button class="letra2">Y</button>
                <button class="letra2">Z</button>
                </div>
            </section>
            <section class="area-reiniciar">
                <button id="reiniciar">Reiniciar Partida</button>
            </section>
        </div>
    </main>
    <script src="jogo.js"></script>
</body>

</html>
